# /etc/nginx/sites-available/api.payroll.hookangles.com  (symlink into sites-enabled)
# This is the plain-HTTP starting point. Run `certbot --nginx -d api.payroll.hookangles.com`
# and certbot adds the 443 server block and the redirect, as it did for the other sites.
server {
    listen 80;
    server_name api.payroll.hookangles.com;
    client_max_body_size 2m;   # CSV employee imports

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
