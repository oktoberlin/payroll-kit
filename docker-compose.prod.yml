# Production stack for a DEDICATED host: Caddy (HTTPS) -> gunicorn API -> Postgres.
# Do NOT run this on the shared VPS: Caddy binds ports 80/443, which nginx already owns.
# For that box use the systemd + nginx files in deploy/ (see deploy/SETUP.md).
# Usage: cp .env.example .env, edit it, then
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payrollkit
      POSTGRES_USER: payrollkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrollkit"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://payrollkit:${POSTGRES_PASSWORD}@db:5432/payrollkit
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS: "1"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
